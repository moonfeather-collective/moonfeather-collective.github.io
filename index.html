<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moonfeather Collective - Dart&Flutter OSS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <style>
    :root {
      --bg: #120d1a;
      --surface: #1a162a;
      --accent: #ff00d0;
      --accent2: #ffd24c;
      --text: #f0e6ff;
      --muted: #a89bc2;
      --border: #3e2250;
    }

    body {
      box-sizing: border-box;
      margin: 0;

      overflow: hidden;

      background: var(--bg);
      color: var(--text);
      font-family: 'Instrument Sans', 'Helvetica Neue', 'Arial', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      font-family: 'Josefin Sans', 'Futura', 'Helvetica', serif;
      font-weight: 500;
      color: var(--accent2);
    }

    section {
      flex: 1;
      width: 100%;

      &+& {
        margin-top: 2rem;
        /* margin vertical between sections */
      }
    }

    @media (min-width: 768px) {
      .logo-header {
        width: 50vmin;
        max-width: 80vw;
      }
    }

    @media (max-width: 767px) {
      .logo-header {
        width: 80vmin;
        max-width: 90vw;
      }
    }

    @media (min-width: 1024px) {
      .logo-header {
        width: 40vmin;
        max-width: 70vw;
      }
    }

    section#main {
      flex: 1;

      display: flex;
      flex-direction: column;
      align-items: center;
      /* justify-content: center; */

      padding-top: 20vh;

      .logo-header {
        display: flex;
        flex-direction: column;
        align-items: center;

        img {
          width: 100%;
          height: auto;
        }
      }
    }

    section#footer {
      flex: 0;

      .row {
        display: flex;
        flex-direction: row;
        justify-content: center;
        gap: 1rem;
      }

      .social-link {
        color: var(--surface);
        font-size: 1.5rem;
        display: inline-block;
      }
    }

    @keyframes scroll {
      0% {
        mask-position: 0 0;
      }

      100% {
        mask-position: -100% 0;
      }
    }

    .cloud-background {
      position: absolute;
      bottom: -7.5vh;
      left: 0;
      right: 0;
      width: 100%;
      height: 50vh;
      overflow: hidden;
      z-index: -1;

      display: block;

      .cloud-layer {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 200vw;
        width: calc(2 * 100vw * (100vh / 100vw));
        height: 20vh;

        display: block;

        -webkit-mask-image: url('assets/img/Clouds layer.svg');
        mask-image: url('assets/img/Clouds layer.svg');
        mask-repeat: repeat-x;
        /* mask-position: top left; */
        mask-size: 30%;
        mask-origin: border-box;


        --height-offset: 10vh;
        --speed-offset: 5s;
        --speed-base: 4s;

        --layer-count: 4;

        bottom: calc(var(--height-offset) * var(--layer-index));
        animation: scroll calc(var(--speed-base) + var(--speed-offset) * var(--layer-index)) linear infinite;
        animation-delay: calc(var(--speed-offset) * -var(--layer-index));
        z-index: calc(var(--layer-count) - var(--layer-index));

        &.layer1 {
          /* svg color fill*/
          background-color: #C8B6FF;

          --layer-index: 0;
        }

        &.layer2 {
          /* svg color fill*/
          background-color: #A084F7;

          --layer-index: 1;
        }

        &.layer3 {
          /* svg color fill*/
          background-color: #664FAE;

          --layer-index: 2;
        }

        &.layer4 {
          /* svg color fill*/
          background-color: #3A257C;


          --layer-index: 3;
        }
      }
    }
  </style>

  <link
    href="https://fonts.googleapis.com/css2?family=Josefin+Sans&family=Instrument+Sans:wght@400;700&display=swap&family=Cormorant+Garamond"
    rel="stylesheet" />

  <link href="assets/css/fontawesome.min.css" rel="stylesheet" />
  <link href="assets/css/brands.min.css" rel="stylesheet" />
</head>

<body>
  <!-- 4 layers of clouds scrolling background -->
  <div class="cloud-background">
    <div class="cloud-layer layer1">
    </div>
    <div class="cloud-layer layer2">
    </div>
    <div class="cloud-layer layer3">
    </div>
    <div class="cloud-layer layer4">
    </div>
  </div>
  <section id="main">
    <h1 class="logo-header">
      <img src="assets/img/Logo.png" alt="Moonfeather Collective">
      <img src="assets/img/Text.png" alt="Moonfeather Collective">
    </h1>
    <h2>Coming soon!</h2>
  </section>
  <section id="footer">
    <div class="row">
      <a href="https://bsky.social/profile/moonfeather.dev" class="social-link" alt="BlueSky">
        <i class="fa fa-brands fa-bluesky"></i>
      </a>
      <a href="https://github.com/moonfeather-collective" class="social-link" alt="GitHub">
        <i class="fa fa-brands fa-github"></i>
      </a>
      <a href="https://pub.dev/publishers/moonfeather.dev/packages" class="social-link" alt="pub.dev">
        <i class="fa fa-brands fa-dart-lang"></i>
      </a>
    </div>
  </section>
</body>

</html>
